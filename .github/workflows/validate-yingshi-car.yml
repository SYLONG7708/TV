name: Validate Yingshi car Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mobile/yingshi-car/**
      - docs/iphone/*.mjs
      - docs/iphone/*.html
      - docs/iphone/*.css
      - .github/workflows/validate-yingshi-car.yml
  pull_request:
    paths:
      - mobile/yingshi-car/**
      - docs/iphone/*.mjs
      - docs/iphone/*.html
      - docs/iphone/*.css
      - .github/workflows/validate-yingshi-car.yml

permissions:
  contents: read

concurrency:
  group: yingshi-car-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mobile/yingshi-car/**
            docs/iphone/*
            docs/assets/*
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Rebuild bundled fallback and verify it
        working-directory: mobile/yingshi-car
        run: |
          npm ci
          npm run build:compat
          npm test
      - name: Compile Android and check release lint
        working-directory: mobile/yingshi-car
        run: bash gradlew --no-daemon :app:assembleLicensedDebug :app:lintLicensedRelease
      - name: Preserve lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yingshi-car-lint-${{ github.run_id }}
          path: mobile/yingshi-car/app/build/reports/lint-results-licensedRelease.*
