name: OKTV automatic diagnosis and recovery

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "47 * * * *"
  workflow_run:
    workflows:
      - Update YouTube live sources
      - Update LunaTV VOD sources
      - Deploy OKTV lightweight Pages
      - Validate OKTV integrity
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: oktv-automatic-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current trusted diagnostic tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/check-oktv-system-health.mjs
            tools/vod-payload-parser.mjs
            tools/recover-oktv.mjs

      - name: Inspect public page, catalog, every index, APIs, and live data
        continue-on-error: true
        run: node tools/check-oktv-system-health.mjs --output oktv-system-health.json --probeApis true --failOnDegraded false

      - name: Repair failed workflows or stale data without duplicate runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/recover-oktv.mjs --health oktv-system-health.json --output oktv-recovery-report.json

      - name: Preserve diagnosis and repair decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oktv-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            oktv-system-health.json
            oktv-recovery-report.json
          retention-days: 14
          if-no-files-found: ignore
