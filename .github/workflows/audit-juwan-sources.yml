name: Audit Juwan public sources

on:
  workflow_dispatch:
  schedule:
    # 01:17 UTC+8; the established VOD job checks its window at 02:00.
    - cron: '17 17 * * *'
  push:
    branches: [feat/juwan-source-integration-20261111]
    paths:
      - tools/audit-juwan-sources.mjs
      - .github/workflows/audit-juwan-sources.yml

permissions:
  contents: read

concurrency:
  group: oktv-juwan-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/audit-juwan-sources.mjs
            tools/audit-upstream-sources.mjs
            tools/vod-payload-parser.mjs
            /sources/TVBOX
            /sources/All on-demand sources
      - name: Discover all public source pages and inspect configurations
        run: node tools/audit-juwan-sources.mjs --timeoutMs 15000
      - name: Record findings
        if: success()
        run: cat reports/juwan-latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: juwan-audit-${{ github.run_id }}
          path: reports/juwan-latest.*
          if-no-files-found: warn
          retention-days: 90
