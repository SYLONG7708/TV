name: Audit Juwan public sources

on:
  workflow_dispatch:
    inputs:
      fullSite:
        description: Inspect every page in the public sitemap (initial full audit)
        type: boolean
        default: false
  schedule:
    # 01:17 UTC+8; the established VOD job checks its window at 02:00.
    - cron: '17 17 * * *'
    # Complete the initial article scan in small batches, respecting the origin.
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: oktv-juwan-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'schedule' || github.event.schedule == '17 17 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/audit-juwan-sources.mjs
            tools/audit-upstream-sources.mjs
            tools/vod-payload-parser.mjs
            /sources/TVBOX
            /sources/All on-demand sources
      - name: Discover all public source pages and inspect configurations
        run: node tools/audit-juwan-sources.mjs --timeoutMs 15000
      - name: Record findings
        if: success()
        run: cat reports/juwan-latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: juwan-audit-${{ github.run_id }}
          path: reports/juwan-latest.*
          if-no-files-found: warn
          retention-days: 90
  site:
    if: (github.event_name == 'workflow_dispatch' && inputs.fullSite) || (github.event_name == 'schedule' && github.event.schedule != '17 17 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/crawl-juwan-site.mjs
            tools/audit-juwan-sources.mjs
            tools/audit-upstream-sources.mjs
            tools/vod-payload-parser.mjs
      - name: Restore the most recent site checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.expired == false and (.name | startswith("juwan-site-")))) | .[0] | if . then [.workflow_run.id, .name] | @tsv else empty end')"
          if [ -n "$previous" ]; then
            read -r run artifact <<< "$previous"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir reports
          fi
      - name: Inspect all sitemap pages with request pacing
        id: scan
        run: |
          pages=24
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.fullSite }}' = 'true' ]; then pages=0; fi
          node tools/crawl-juwan-site.mjs --delayMs 2400 --maxPages "$pages"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.scan.outputs.changed != 'false'
        with:
          name: juwan-site-progress-${{ github.run_id }}
          path: reports/juwan-site.json
          if-no-files-found: warn
          retention-days: 90
