    <title>影視 OKTV iPhone</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js" integrity="sha384-iZBI1/lW9u8FcBjxuQ8nPTsU7TXhZNtzkV8H3gQHSTgz+VYQoKWqGlBHqhO84alJ" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js" integrity="sha384-rNlaE5fs9dGIjmxWDALQh/RBAaGRYT5ChrzHo6tRfgrZ36iRFAiquP5g41Jsv+0j" crossorigin="anonymous" defer></script>
    <style data-csp-hash>
      :root {
        color-scheme: dark;
        --bg: #050507;
        --panel: rgba(17, 18, 22, 0.92);
        --panel-2: rgba(25, 27, 33, 0.94);
        --line: rgba(255, 255, 255, 0.12);
        --text: #f5f5f7;
        --muted: #b8bac3;
        --dim: #7f838e;
        --accent: #9f114c;
        --accent-2: #d81769;
        --cyan: #32d6e7;
        --green: #5bd58e;
        --amber: #f2bd5c;
        --red: #ff6571;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background:
          linear-gradient(90deg, rgba(5, 5, 7, 0.97), rgba(5, 5, 7, 0.9)),
          url("../assets/hero-cinema.png") right top / auto 100vh no-repeat,
          var(--bg);
        color: var(--text);
        font-family:
          "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        overflow-x: hidden;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app {
        width: min(100%, 1180px);
        min-height: 100vh;
        margin: 0 auto;
        padding: max(12px, env(safe-area-inset-top)) 12px max(30px, env(safe-area-inset-bottom));
      }

      .top-nav {
        position: sticky;
        top: 0;
        z-index: 30;
        min-height: 70px;
        display: flex;
        align-items: center;
        gap: 18px;
        overflow-x: auto;
        padding: 8px 0 12px;
        background: linear-gradient(180deg, rgba(5, 5, 7, 0.99), rgba(5, 5, 7, 0.74));
        backdrop-filter: none;
        scrollbar-width: none;
      }

      .top-nav::-webkit-scrollbar,
      .chip-row::-webkit-scrollbar,
      .source-rail::-webkit-scrollbar {
        display: none;
      }

      .nav-btn {
        flex: 0 0 auto;
        min-height: 46px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.72);
        padding: 0 8px;
        font-size: clamp(1.05rem, 5.6vw, 1.7rem);
        font-weight: 650;
        white-space: nowrap;
        cursor: pointer;
      }

      .nav-btn.is-active {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        padding: 0 22px;
        font-weight: 900;
      }

      .nav-source-btn {
        flex: 0 0 auto;
        width: 52px;
        height: 52px;
        border: 1px solid rgba(50, 214, 231, 0.55);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 5px;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(50, 214, 231, 0.16);
      }

      .nav-source-btn img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }

      .search {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        padding: 0 12px;
        outline: none;
      }

      .search:focus {
        border-color: rgba(216, 23, 105, 0.82);
      }

      .icon-btn,
      .text-icon-btn,
      .play-btn {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
      }

      .icon-btn {
        width: 42px;
      }

      .text-icon-btn,
      .play-btn {
        padding: 0 12px;
        white-space: nowrap;
      }

      .icon-btn svg,
      .text-icon-btn svg,
      .play-btn svg,
      .status-pill svg {
        width: 18px;
        height: 18px;
      }

      .hero {
        min-height: 46vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(118px, 32%);
        gap: 14px;
        align-items: end;
        margin-bottom: 14px;
      }

      .hero-copy {
        min-width: 0;
        padding-bottom: 6px;
      }

      .hero-kicker {
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .hero h1 {
        margin: 8px 0 8px;
        font-size: clamp(2.2rem, 13vw, 4.5rem);
        line-height: 0.95;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .hero-meta,
      .item-meta,
      .section-head span,
      .source-row span,
      .episode-grid span {
        color: var(--muted);
      }

      .hero-poster {
        min-width: 0;
      }

      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin: 14px 0 10px;
      }

      .section-head h1,
      .section-head h2 {
        margin: 0;
        font-size: clamp(1.18rem, 5.8vw, 1.72rem);
      }

      .search-section-head .status-pill {
        max-width: 100%;
      }

      .poster-grid,
      .rank-list,
      .source-list,
      .live-list {
        display: grid;
        gap: 12px;
      }

      .poster-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .poster-card {
        min-width: 0;
        border: 0;
        background: transparent;
        color: inherit;
        padding: 0;
        text-align: left;
        cursor: pointer;
        content-visibility: auto;
        contain-intrinsic-size: 260px 150px;
      }

      .poster-art {
        position: relative;
        aspect-ratio: 0.72;
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background:
          linear-gradient(135deg, #153746, #60183c 52%, #120911);
      }

      .poster-art img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .poster-art img.is-broken {
        display: none;
      }

      .poster-fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 14px;
        text-align: center;
        font-size: 0;
        font-weight: 900;
        line-height: 1.08;
        overflow-wrap: anywhere;
        color: transparent;
      }

      .poster-fallback::after {
        content: "";
        width: 42%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.05);
      }

      .poster-art img:not(.is-broken) + .poster-fallback {
        display: none;
      }

      .badge,
      .score,
      .adult-content-badge {
        position: absolute;
        z-index: 2;
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        border-radius: 6px;
        background: rgba(20, 20, 24, 0.78);
        color: #fff;
        padding: 0 8px;
        font-size: 0.82rem;
        max-width: calc(100% - 16px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .score {
        top: 8px;
        left: 8px;
      }

      .badge {
        left: 8px;
        bottom: 8px;
      }

      .adult-content-badge {
        top: 8px;
        right: 8px;
        gap: 5px;
        background: rgba(216, 23, 105, 0.92);
        font-weight: 900;
      }

      .adult-content-badge img,
      .poster-title .adult-source-icon {
        width: 22px;
        height: 22px;
      }

      .poster-title {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        color: #fff;
        font-size: 1rem;
        line-height: 1.25;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .poster-sub {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.78rem;
        overflow: hidden;
        white-space: nowrap;
      }

      .chip-row,
      .source-rail,
      .area-rail,
      .quick-filter-row {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin-bottom: 12px;
        scrollbar-width: none;
      }

      .chip {
        flex: 0 0 auto;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--muted);
        padding: 0 12px;
        cursor: pointer;
      }

      .chip.is-active {
        border-color: rgba(216, 23, 105, 0.76);
        background: rgba(216, 23, 105, 0.24);
        color: #fff;
      }

      .quick-filters {
        display: grid;
        gap: 2px;
        margin-bottom: 12px;
      }

      .quick-filter-block {
        min-width: 0;
      }

      .quick-filter-label {
        display: block;
        margin: 0 0 6px 2px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .source-pill {
        flex: 0 0 auto;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: inherit;
        padding: 0 12px;
        cursor: pointer;
      }

      .source-pill.is-active {
        border-color: rgba(50, 214, 231, 0.6);
        background: rgba(50, 214, 231, 0.16);
      }

      .source-icon,
      .adult-source-icon {
        width: 28px;
        height: 28px;
        display: inline-block;
        flex: 0 0 auto;
        vertical-align: middle;
      }

      .source-name {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .source-name span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .source-toggle {
        width: 52px;
        height: 52px;
        min-height: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(50, 214, 231, 0.44);
        border-radius: 16px;
        background: rgba(8, 12, 16, 0.96);
        color: #fff;
        padding: 5px;
        margin-bottom: 12px;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(50, 214, 231, 0.14);
      }

      .source-toggle-icon {
        width: 100%;
        height: 100%;
      }

      .source-section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 2px 2px;
        color: #fff;
        font-size: 0.9rem;
        font-weight: 900;
      }

      .source-section-label > span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .source-section-label small {
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 650;
      }

      .source-section-label.is-adult {
        color: #ffd166;
      }

      .source-mode-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }

      .source-mode-row .chip {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .floating-filter {
        position: fixed;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        z-index: 55;
        min-width: 54px;
        min-height: 54px;
        border: 1px solid rgba(216, 23, 105, 0.62);
        border-radius: 999px;
        background: linear-gradient(135deg, #9f114c, #d81769);
        color: #fff;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.36);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .floating-filter svg {
        width: 22px;
        height: 22px;
      }

      .row,
      .source-row {
        min-height: 68px;
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 10px;
      }

      .avatar {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: rgba(216, 23, 105, 0.25);
        color: #fff;
        font-weight: 900;
      }

      .row-main {
        min-width: 0;
      }

      .row-main strong,
      .row-main span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-main span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .status-pill {
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 0 10px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font-size: 0.78rem;
        white-space: nowrap;
      }

      .status-pill.ok {
        background: rgba(91, 213, 142, 0.18);
        color: var(--green);
      }

      .status-pill.warn {
        background: rgba(242, 189, 92, 0.18);
        color: var(--amber);
      }

      button.status-pill {
        border: 0;
        cursor: pointer;
        font: inherit;
      }

      button.status-pill:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }

      .filter-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }

      .notice {
        border: 1px solid rgba(242, 189, 92, 0.34);
        border-radius: 8px;
        background: rgba(242, 189, 92, 0.1);
        color: #ffdc9a;
        padding: 10px 12px;
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .sheet {
        position: fixed;
        inset: 0;
        z-index: 80;
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms ease;
      }

      .sheet.is-open {
        opacity: 1;
        pointer-events: auto;
      }

      .sheet-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.68);
        backdrop-filter: none;
      }

      .sheet-panel {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: min(100%, 740px);
        max-height: 86vh;
        display: flex;
        flex-direction: column;
        transform: translateX(-50%);
        border: 1px solid var(--line);
        border-bottom: 0;
        border-radius: 8px 8px 0 0;
        background: #07070a;
        padding: 12px 12px max(14px, env(safe-area-inset-bottom));
      }

      .sheet-head {
        min-height: 50px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
      }

      .sheet-head strong,
      .sheet-head span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sheet-head span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .sheet-body {
        min-height: 0;
        overflow: auto;
        padding-top: 8px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 116px minmax(0, 1fr);
        gap: 12px;
        margin-bottom: 12px;
      }

      .detail-grid .poster-art {
        min-width: 0;
      }

      .detail-copy {
        min-width: 0;
      }

      .detail-copy h2 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        line-height: 1.18;
      }

      .detail-copy p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.88rem;
      }

      .episode-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .episode-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 8px 0 10px;
      }

      .episode-toolbar small {
        color: var(--muted);
        white-space: nowrap;
      }

      .signal-strip {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        margin: 10px 0 12px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        padding: 1px 0 4px;
        scroll-snap-type: inline proximity;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .signal-strip::-webkit-scrollbar {
        display: none;
      }

      .signal-chip {
        flex: 0 0 auto;
        min-height: 34px;
        border: 1px solid rgba(50, 214, 231, 0.35);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        scroll-snap-align: start;
        white-space: nowrap;
      }

      .signal-chip.is-active {
        border-color: rgba(50, 214, 231, 0.8);
        background: rgba(50, 214, 231, 0.2);
      }

      .episode-pages {
        min-width: 0;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .episode-pages::-webkit-scrollbar {
        display: none;
      }

      .episode-pages button {
        flex: 0 0 auto;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        padding: 0 12px;
        cursor: pointer;
        white-space: nowrap;
      }

      .episode-pages button.is-active {
        border-color: rgba(216, 23, 105, 0.8);
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }

      .episode-grid button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      video,
      .player-frame {
        display: block;
        width: 100%;
        max-height: calc(100dvh - 112px);
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        background: #000;
        object-fit: contain;
      }

      .player-frame {
        border: 0;
      }

      .hidden {
        display: none !important;
      }

      #playerSheet .sheet-panel {
        width: min(100%, 1080px);
        max-height: 100dvh;
      }

      @media (min-width: 620px) {
        .poster-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .episode-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (min-width: 980px) {
        .poster-grid {
          grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        .app {
          padding-inline: 28px;
        }

        .sheet-panel {
          width: min(92vw, 900px);
        }

        #playerSheet .sheet-panel {
          width: min(94vw, 1280px);
        }
      }

      @media (max-width: 430px) {
        .search-section-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .search-section-head .status-pill {
          white-space: normal;
        }

        .top-nav {
          gap: 12px;
        }

        .hero {
          min-height: 36vh;
          grid-template-columns: minmax(0, 1fr) 124px;
        }

        .poster-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .toolbar {
          grid-template-columns: minmax(0, 1fr) 42px;
        }

        .text-icon-btn span {
          display: none;
        }

        .episode-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .episode-toolbar {
          align-items: stretch;
          flex-direction: column;
        }
      }

      @media (max-width: 360px) {
        .app {
          padding-inline: 8px;
        }

        .nav-btn {

        const titleText = normalizedText(item?.title || item?.vod_name || '');
        if (sourceAdult || ADULT_ITEM_TEXT_RE.test(`${categoryText} ${genreText}`)) return 'adult';
        return classifyCatalogKind(categoryText) || classifyCatalogKind(genreText) || classifyTitleKindFromText(titleText) || normalizeVodKind(item?.kind) || 'movie';
      }

      function cleanFilterToken(value) {
        return normalizedText(value)
          .replace(/^[\s:：,_\-，、.·]+|[\s:：,_\-，、.·]+$/g, '')
          .replace(/\s*\/\s*/g, ' / ')
          .trim();
      }

      function cleanFilterYear(value) {
        const match = String(value || '').match(/\b(19\d{2}|20\d{2})\b/);
        if (!match) return '';
        const year = Number(match[1]);
        const maxYear = new Date().getFullYear() + 1;
        return year >= 1900 && year <= maxYear ? String(year) : '';
      }

      function splitFilterValues(value) {
        return String(value || '')
          .split(/[\/／|,，、]+/g)
          .map(cleanFilterToken)
          .filter(Boolean);
      }

      function cleanAreaValues(value) {
        return splitFilterValues(value).filter((item) => item.length >= 2 && item.length <= 12 && !/^\d+$/.test(item));
      }

      function cleanGenreValues(values) {
        const rows = Array.isArray(values) ? values : [values];
        const out = [];
        for (const row of rows) {
          for (const token of splitFilterValues(row)) {
            if (token.length < 2 || token.length > 10) continue;
            if (/^\[db:/i.test(token) || /^_?m$/i.test(token)) continue;
            if (/^\d+$/.test(token)) continue;
            if (!/[\p{Script=Han}A-Za-z0-9]/u.test(token)) continue;
            if (/性霸凌|美臀|美穴|巨乳|主播|啪啪|G奶|色誘|色诱/i.test(token)) continue;
            if (ADULT_ITEM_TEXT_RE.test(token) && state.selectedSource !== 'adult18') continue;
            out.push(token);
          }
        }
        return [...new Set(out)];
      }

      function prepareCatalogItem(item) {
        if (!item) return item;
        item.kind = displayVodKind(item);
        if (item.kind === 'adult') item.adult = true;
        item._filterYear = cleanFilterYear(item.year);
        item._filterAreas = cleanAreaValues(item.area);
        item._filterGenres = cleanGenreValues([...itemGenres(item), item.categoryName, item.typeName, item.type_name]);
        item.year = item._filterYear || '';
        item.area = item._filterAreas.join(' / ');
        item.genre = item._filterGenres;
        const searchSource = [
          item.title,
          item.originalName,
          item.vodId,
          item.categoryName,
          item.year,
          item.area,
          itemGenres(item).join(' '),
          item.sourceName,
          item.actor,
          item.director,
          item.remarks,
        ].join(' ');
        item._posterKey = normalizedPoster(item.poster);
        item._duplicateKey =
          compactNormalizedText(toSimplifiedSearchText(item.title)) ||
          (item._posterKey ? `poster:${item._posterKey}` : item.id || '');
        item._searchText = normalizedText(searchSource);
        item._searchCompact = compactNormalizedText(item._searchText);
        return item;
      }

      function registerCatalogItems(rows, options = {}) {
        if (!Array.isArray(rows) || !rows.length) return 0;
        let changed = 0;
        for (const row of rows) {
          if (!row?.id) continue;
          const prepared = prepareCatalogItem(row);
          const existing = state.itemById.get(prepared.id);
          if (existing) {
            Object.assign(existing, prepared);
            prepareCatalogItem(existing);
          } else {
            state.itemById.set(prepared.id, prepared);
            state.catalog.items.push(prepared);
            if (options.searchResult && !state.seedItemIds.has(prepared.id)) {
              state.searchItemIds.add(prepared.id);
            }
          }
          changed += 1;
        }
        if (changed) {
          state.itemsRevision += 1;
          clearViewCache();
        }
        return changed;
      }

      function clearTransientSearchItems() {
        if (!state.searchItemIds.size) return;
        const transientIds = state.searchItemIds;
        state.catalog.items = state.catalog.items.filter((item) => !transientIds.has(item.id));
        for (const id of transientIds) state.itemById.delete(id);
        transientIds.clear();
        state.itemsRevision += 1;
        clearViewCache();
      }

      function markLatestPagesLoaded(rows) {
        const sourcePages = new Map();
        for (const item of rows || []) {
          const page = Number(item?.detailPage || 0);
          if (!item?.sourceId || page < 1) continue;
          if (!sourcePages.has(item.sourceId)) sourcePages.set(item.sourceId, new Set());
          sourcePages.get(item.sourceId).add(page);
        }
        for (const [sourceId, pages] of sourcePages) {
          const source = sourceById(sourceId);
          const pageState = getSourcePageState(source);
          if (!pageState) continue;
          for (const page of pages) pageState.loaded.add(page);
          while (pageState.loaded.has(pageState.nextPage)) pageState.nextPage += 1;
        }
      }

      function sourcePageCount(source) {
        const expectedPages =
          Number(source?.detailExpectedPages || 0) ||
          Number(source?.checks?.find?.((check) => Number(check.pagecount) > 0)?.pagecount || 0);
        const checkPages = Number(source?.checks?.find?.((check) => Number(check.pages) > 0)?.pages || 0);
        return Math.max(
          0,
          Number(
            expectedPages ||
              checkPages ||
              Math.ceil(Number(source?.itemCount || source?.sourceTotalCount || 0) / SOURCE_DETAIL_PAGE_SIZE),
          ),
        );
      }

      function sourceDetailPath(source, page) {
        if (!source?.detailPathPattern) return '';
        return source.detailPathPattern.replace('{page}', String(page).padStart(4, '0'));
      }

      function getSourcePageState(source) {
        if (!source?.id) return null;
        if (!state.sourcePageState.has(source.id)) {
          state.sourcePageState.set(source.id, {
            loaded: new Set(),
            loading: new Map(),
            nextPage: 1,
            totalPages: sourcePageCount(source),
          });
        }
        return state.sourcePageState.get(source.id);
      }

      async function ensureSourcePage(source, page) {
        const pageState = getSourcePageState(source);
        const path = sourceDetailPath(source, page);
        if (!pageState || !path || page < 1 || (pageState.totalPages && page > pageState.totalPages)) return false;
        if (pageState.loaded.has(page)) return true;
        if (pageState.loading.has(page)) return await pageState.loading.get(page);
        const promise = (async () => {
          const payload = await getJson(`../data/${path}`, null);
          const rows = Array.isArray(payload?.items) ? payload.items : [];
          if (!rows.length) return false;
          setBoundedCache(state.detailCache, path, payload, DETAIL_CACHE_LIMIT);
          registerCatalogItems(rows);
          pageState.loaded.add(page);
          while (pageState.loaded.has(pageState.nextPage)) pageState.nextPage += 1;
          return true;
        })()
          .catch(() => false)
          .finally(() => pageState.loading.delete(page));
        pageState.loading.set(page, promise);
        return await promise;
      }

      async function ensureNextSourcePage() {
        if (['all', 'normal', 'adult18'].includes(state.selectedSource)) {
          return await ensureSelectedSourceItems(state.selectedSource, { eager: true, limit: 4 });
        }
        const source = sourceById(state.selectedSource);
        const pageState = getSourcePageState(source);
        if (!source?.detailPathPattern || !pageState || !pageState.nextPage || pageState.nextPage > pageState.totalPages) return false;
        return await ensureSourcePage(source, pageState.nextPage);
      }

      function itemIdentityMatches(entry, item) {
        return Boolean(entry && (entry.id === item.id || (entry.vodId && entry.vodId === item.vodId)));
      }

      async function detailItemAtPath(item, detailPath) {
        if (!detailPath) return null;
        let detail = state.detailCache.get(detailPath);
        if (!detail) {
          detail = await getJson(`../data/${detailPath}`, null);
          if (!detail) return null;
          setBoundedCache(state.detailCache, detailPath, detail, DETAIL_CACHE_LIMIT);
        }
        return (detail.items || []).find((entry) => itemIdentityMatches(entry, item)) || null;
      }

      async function indexedDetailPathFor(item) {
        return item?.detailPath || '';
      }

      async function hydrateItemDetail(item) {
        if (Array.isArray(item?.episodes) && item.episodes.length) return item;
        if (!item?.detailPath) return item;
        const indexedDetailPath = await indexedDetailPathFor(item);
        const found = await detailItemAtPath(item, indexedDetailPath);
        if (!found) throw new Error('detail-item-not-found');
        Object.assign(item, found, { lazyEpisodes: false });
        return item;
      }

      function hasRegisteredSourceItems(sourceId) {
        return state.catalog.items.some((item) => item.sourceId === sourceId);
      }

      function sourceSupportsCurrentTab(source) {
        if (!source) return false;
        if (state.tab === 'home' || state.tab === 'rank') return true;
        if (state.tab === 'live') return false;
        const categories = Array.isArray(source.categories) ? source.categories : [];
        if (!categories.length) return true;
        return categories.some((category) => classifyCatalogKind(category) === state.tab);
      }

      function combinedSourceCandidates(sourceId) {
        const wantAdult = sourceId === 'adult18';
        return state.catalog.sources.filter((source) => {
          if (!source.indexed || state.loadedSourceIds.has(source.id)) return false;
          if (sourceId !== 'all' && Boolean(source.adult) !== wantAdult) return false;
          return true;
        });
      }

      async function ensureSourceIndex(source) {
        if (!source || state.loadedSourceIds.has(source.id)) return false;
        if (hasRegisteredSourceItems(source.id)) {
          state.loadedSourceIds.add(source.id);
          return false;
        }
        if (source.detailPathPattern) {
          const loaded = await ensureSourcePage(source, 1);
          if (loaded) {
            state.loadedSourceIds.add(source.id);
            return true;
          }
          const pageState = getSourcePageState(source);
          if (pageState) {
            pageState.nextPage = 0;
            pageState.totalPages = 0;
          }
        }
        if (!source.indexPath) return false;
        const payload = await getJson(`../data/${source.indexPath}`, null);
        const rows = Array.isArray(payload?.items) ? payload.items : [];
        if (!rows.length && source.itemCount) throw new Error('source-index-empty');
        registerCatalogItems(rows);
        state.loadedSourceIds.add(source.id);
        return rows.length > 0;
      }

      function searchIndexItemText(item) {
        return [
          item?.title,
          item?.originalName,
          item?.vodId,
          item?.categoryName,
          item?.typeName,
          item?.type_name,
          item?.year,
          item?.area,
          Array.isArray(item?.genre) ? item.genre.join(' ') : item?.genre,
          item?.sourceName,
          item?.actor,
          item?.director,
          item?.remarks,
        ]
          .filter(Boolean)
          .join(' ');
      }

      function buildRawSearchCandidate(value) {
        const query = String(value ?? '').trim().replace(/\s+/g, ' ').toLowerCase();
        const compact = compactNormalizedText(query);
        const tokens = query.split(/\s+/g).map((token) => token.trim()).filter(Boolean);
        const compactTokens = tokens.map((token) => compactNormalizedText(token));
        return { query, compact, tokens, compactTokens };
      }

      function rawSearchIndexNeedle(needle) {
        if (needle.rawIndexNeedle) return needle.rawIndexNeedle;
        const values = [];
        for (const candidate of needle.candidates?.length ? needle.candidates : [needle]) {
          values.push(candidate.query, toSimplifiedSearchText(candidate.query));
        }
        const seen = new Set();
        const candidates = [];
        for (const value of values) {
          const candidate = buildRawSearchCandidate(value);
          if (!candidate.compact || seen.has(candidate.compact)) continue;
          seen.add(candidate.compact);
          candidates.push(candidate);
        }
        needle.rawIndexNeedle = { candidates };
        return needle.rawIndexNeedle;
      }

      async function matchingSearchIndexRows(rows, needle, signal) {
        if (!needle?.query) return rows;
        const matches = [];
        const rawNeedle = rawSearchIndexNeedle(needle);
        for (let index = 0; index < rows.length; index += 1) {
          if (index && index % SEARCH_INDEX_YIELD_EVERY === 0) {
            await new Promise((resolve) => setTimeout(resolve, 0));
            if (signal?.aborted) throw new DOMException('Search aborted', 'AbortError');
            if (currentSearchNeedle().query !== needle.query) return matches;
          }
          const row = rows[index];
          const searchText = searchIndexItemText(row).trim().replace(/\s+/g, ' ').toLowerCase();
          if (!searchTextMatchesNeedle(searchText, compactNormalizedText(searchText), rawNeedle)) continue;
          matches.push(row);
          if (matches.length >= SEARCH_INDEX_MATCH_LIMIT) break;
        }
        return matches;
      }

      async function mapAsyncLimit(items, limit, worker) {
        let next = 0;
        const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
          while (next < items.length) {
            const index = next++;
            await worker(items[index], index);
          }
        });
        await Promise.all(workers);
      }

      async function ensureSourceListItems(sources) {
        if (!sources.length) return false;
        let loaded = 0;
        await mapAsyncLimit(sources, 4, async (source) => {
          try {
            if (await ensureSourceIndex(source)) loaded += 1;
          } catch {
            // Keep the combined catalog usable even when one remote source is temporarily empty.
          }
        });
        return loaded > 0;
      }

      async function ensureSelectedSourceItems(sourceId, options = {}) {
        if (!['all', 'normal', 'adult18'].includes(sourceId)) {
          return await ensureSourceIndex(sourceById(sourceId));
        }
        if (!options.eager) return false;
        const limit = Math.max(1, Number(options.limit || 4));
        const candidates = combinedSourceCandidates(sourceId);
        const supported = candidates.filter(sourceSupportsCurrentTab);
        const sources = (supported.length ? supported : candidates).slice(0, limit);
        return await ensureSourceListItems(sources);
      }

          .replaceAll('<', '&lt;')

      const ZH_SIMPLIFIED_CHAR_MAP = Object.fromEntries(
        Object.entries(ZH_CHAR_MAP).map(([simplified, traditional]) => [traditional, simplified]),
      );
      const ZH_PHRASE_MAP = new Map(ZH_PHRASES);
      const ZH_PHRASE_RE = new RegExp(
        [...ZH_PHRASE_MAP.keys()].sort((left, right) => right.length - left.length).join('|'),
        'g',
      );

      function toTraditional(value) {
        let text = String(value ?? '');
        text = text.replace(ZH_PHRASE_RE, (phrase) => ZH_PHRASE_MAP.get(phrase) ?? phrase);
        return text.replace(/[\u3400-\u9fff]/g, (char) => ZH_CHAR_MAP[char] || char);
      }

      function toSimplifiedSearchText(value) {
        return String(value ?? '').replace(
          /[\u3400-\u9fff]/g,
          (char) => ZH_SIMPLIFIED_CHAR_MAP[char] || char,
        );
      }

      function displayText(value) {
        return toTraditional(value);
      }

      function displayHtml(value) {
        return escapeHtml(displayText(value));
      }

      function plainTextFromMarkup(value) {
        const raw = String(value ?? '').trim();
        if (!raw || !/[<&]/.test(raw)) return raw;
        return raw
          .replace(/<[^>]*>/g, ' ')
          .replace(/&nbsp;/gi, ' ')
          .replace(/&amp;/gi, '&')
          .replace(/&lt;/gi, '<')
          .replace(/&gt;/gi, '>')
          .replace(/&quot;/gi, '"')
          .replace(/&#0*39;|&apos;/gi, "'")
          .replace(/&#(\d{1,7});/g, (_, code) => {
            const point = Number(code);
            return Number.isInteger(point) && point > 0 && point <= 0x10ffff ? String.fromCodePoint(point) : ' ';
          })
          .replace(/&#x([\da-f]{1,6});/gi, (_, code) => {
            const point = Number.parseInt(code, 16);
            return Number.isInteger(point) && point > 0 && point <= 0x10ffff ? String.fromCodePoint(point) : ' ';
          })
          .replace(/\s+/g, ' ')
          .trim();
      }

      function initials(value) {
        return [...displayText(value || '影視').replace(/\s+/g, '')].slice(0, 2).join('');
      }

      function imageSrc(value) {
        return safeHttpUrl(value);
      }

      function safeHttpUrl(value) {
        const raw = String(value || '').trim();
        if (!raw) return '';
        try {
          const url = new URL(raw, location.href);
          if (url.protocol === 'http:') url.protocol = 'https:';
          if (url.protocol !== 'https:') return '';
          url.username = '';
          url.password = '';
          return url.href;
        } catch {
          return '';
        }
      }

      function safeEmbedUrl(value) {
        const safe = safeHttpUrl(value);
        if (!safe) return '';
        const url = new URL(safe);
        const allowedHosts = new Set(['www.youtube.com', 'youtube.com', 'www.youtube-nocookie.com']);
        if (!allowedHosts.has(url.hostname) || !url.pathname.startsWith('/embed/')) return '';
        return url.href;
      }

      function normalizedText(value) {
        return toTraditional(value).trim().replace(/\s+/g, ' ').toLowerCase();
      }

      function compactNormalizedText(value) {
        return String(value ?? '').replace(/[\s\-_.:：\/\\|,，。！!？?·'"()[\]{}]+/g, '');
      }

      function compactSearchText(value) {
        return compactNormalizedText(normalizedText(value));
      }

      function uniqueSearchValues(values) {
        const seen = new Set();
        const out = [];
        for (const value of values) {
          const text = normalizedText(value);
          const key = compactNormalizedText(text);
          if (!key || seen.has(key)) continue;
          seen.add(key);
          out.push(text);
        }
        return out;
      }

      function searchAliasQueries(query, compact) {
        const aliases = [];
        for (const group of state.queryIndex.manifest?.titleAliases || []) {
          const variants = uniqueSearchValues([group?.canonicalTraditional, ...(group?.aliases || [])]);
          for (const variant of variants) {
            if (!query.includes(variant)) continue;
            for (const replacement of variants) {
              if (replacement !== variant) aliases.push(query.replaceAll(variant, replacement));
            }
          }
        }
        if (query.includes('特務')) aliases.push(query.replaceAll('特務', '特工'));
        if (query.includes('特工')) aliases.push(query.replaceAll('特工', '特務'));
        if (/金(?:牌)?特(?:務|工)|kingsman/i.test(compact)) {
          aliases.push('王牌特工', '王牌特工 黃金圈', '王牌特工 特工學院', '王牌特工 源起', 'kingsman');
        }
        return aliases;
      }

      function buildSearchCandidate(value) {
        const query = normalizedText(value);
        const compact = compactNormalizedText(query);
        const tokens = query.split(/\s+/g).map((token) => token.trim()).filter(Boolean);
        const compactTokens = tokens.map((token) => compactNormalizedText(token));
        return { query, compact, tokens, compactTokens };
      }

      function fuzzySearchMinLength(value) {
        const hanCount = (value.match(/\p{Script=Han}/gu) || []).length;
        return hanCount >= 3 ? 3 : 4;
      }

      function searchTargetResultCount(needle) {
        if ((needle.candidates?.length || 0) > 2) return 2;
        if ((needle.compact || '').length >= 4) return 24;
        return GROUP_SEARCH_TARGET_RESULTS;
      }

      let searchNeedleCache = { raw: null, needle: null };

      function currentSearchNeedle() {
        const raw = state.query || '';
        if (searchNeedleCache.raw === raw) return searchNeedleCache.needle;
        const query = normalizedText(raw);
        const compact = compactNormalizedText(query);
        const tokens = query.split(/\s+/g).map((token) => token.trim()).filter(Boolean);
        const compactTokens = tokens.map((token) => compactNormalizedText(token));
        const candidates = uniqueSearchValues([query, ...searchAliasQueries(query, compact)]).map(buildSearchCandidate);
        const needle = { query, compact, tokens, compactTokens, candidates };
        searchNeedleCache = { raw, needle };
        return needle;
      }

      function compactIncludesInOrder(haystack, needle) {
        if (!needle) return true;
        let offset = 0;
        for (const char of needle) {
          offset = haystack.indexOf(char, offset);
          if (offset < 0) return false;
          offset += char.length;
        }
        return true;
      }

      function searchCandidateMatches(searchText, compactText, needle) {
        if (!needle.query) return true;
        if (searchText.includes(needle.query)) return true;
        if (needle.compact && compactText.includes(needle.compact)) return true;
        if (
          needle.tokens.length > 1 &&
          needle.tokens.every((token, index) => searchText.includes(token) || compactText.includes(needle.compactTokens[index]))
        ) {
          return true;
        }
        return needle.compact.length >= fuzzySearchMinLength(needle.compact) && compactIncludesInOrder(compactText, needle.compact);
      }

      function searchTextMatchesNeedle(searchText, compactText, needle) {
        const candidates = needle.candidates?.length ? needle.candidates : [needle];
        return candidates.some((candidate) => searchCandidateMatches(searchText, compactText, candidate));
      }

      async function loadQuantumManifest() {
        if (state.quantum.manifest) return state.quantum.manifest;
        const manifest = await getJson(QUANTUM_MANIFEST_URL, null);
        if (!manifest) return null;
        state.quantum.manifest = manifest;
        const source = quantumSource();
        if (source) {
          source.indexed = true;
          source.adult = false;
          source.itemCount = manifest.totals?.normalizedItems || source.itemCount || 0;
          source.playableCount = manifest.totals?.playableItems || source.playableCount || 0;
          source.sourceTotalCount = manifest.totals?.apiTotal || source.sourceTotalCount || source.itemCount || 0;
          source.categories = (manifest.classes || []).map((item) => ({
            id: String(item.type_id || item.id || item.type_name || item.name || ''),
            name: item.type_name || item.name || String(item),
            kind: item.type_name || item.name || String(item),
          }));
          source.checks = [{ label: '全量索引', ok: true, count: source.itemCount, total: source.sourceTotalCount }];
          source.error = '';
        }
        return manifest;

      async function loadQuantumKind(kind) {
        if (state.quantum.loadedKinds.has(kind)) return;
        if (state.quantum.loadingKinds.has(kind)) return state.quantum.loadingKinds.get(kind);
        const task = (async () => {
          const manifest = await loadQuantumManifest();
          const chunk = manifest?.chunks?.find((item) => item.kind === kind);
          if (!chunk?.file) return;
          const payload = await getJson(`${QUANTUM_BASE_URL}${chunk.file}`, null);
          const source = quantumSource();
          const sourceId = source?.id || 'quantum-lzi';
          const sourceName = source?.name || '量子影視｜追劇';
          const rows = (payload?.items || []).map((item) => ({
            ...item,
            sourceId,
            sourceName,
            adult: item.kind === 'adult' || Boolean(item.adult),
            genre: Array.isArray(item.genre) ? item.genre : [],
            episodes: Array.isArray(item.episodes) ? item.episodes : [],
            lazyEpisodes: false,
          }));
          registerCatalogItems(rows);
          state.quantum.loadedKinds.add(kind);
        })().finally(() => state.quantum.loadingKinds.delete(kind));
        state.quantum.loadingKinds.set(kind, task);
        return task;
      }

      function ensureQuantumForCurrentView() {
        const kinds = quantumKindsForCurrentView().filter((kind) => !state.quantum.loadedKinds.has(kind) && !state.quantum.loadingKinds.has(kind));
        if (!kinds.length) return;
        Promise.all(kinds.map(loadQuantumKind)).then(render).catch(() => undefined);

            continue;
          }
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(item);
        }
        const rows = [];
        for (const group of groups.values()) {
          const primary =
            group.find((item) => Array.isArray(item.episodes) && item.episodes.length) ||
            group.find((item) => item.playable && item.detailPath) ||
            group.find((item) => item.playable) ||
            group[0];
          const signalSources = [];
          const seenSignals = new Set();
          for (const item of group) {
            const signal = signalSourceEntry(item);
            const signalKey = `${signal.sourceId || ''}\u001f${signal.itemId || ''}`;
            if (seenSignals.has(signalKey)) continue;
            seenSignals.add(signalKey);
            signalSources.push(signal);
          }
          primary.signalSources = signalSources;
          primary.signalCount = signalSources.length;
          primary._duplicateKey = itemDuplicateKey(primary);
          rows.push(primary);
        }
        for (const item of passthrough) {
          item.signalSources = [signalSourceEntry(item)];
          item.signalCount = 1;
          rows.push(item);
        }
        return rows;
      }

      function visibleItems() {
        const cacheKey = viewCacheKey('visible');
        if (state.viewCache.has(cacheKey)) return state.viewCache.get(cacheKey);
        const rows = uniqueItems(sortedItems(sourceItems()));
        state.viewCache.set(cacheKey, rows);
        return rows;
      }

      async function maybeLoadMore() {
        if (state.tab === 'live') return;
        if (window.innerHeight + window.scrollY < document.documentElement.scrollHeight - 900) return;
        const all = visibleItems();
        if (state.visibleLimit < all.length) {
          state.visibleLimit = Math.min(all.length, state.visibleLimit + baseVisibleLimit());
          render();
          requestAnimationFrame(() => {
            if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 900) maybeLoadMore();
          });
          return;
        }
        if (loadMoreInFlight) return;
        loadMoreInFlight = ensureNextSourcePage().finally(() => {
          loadMoreInFlight = null;
        });
        const loaded = await loadMoreInFlight;
        if (!loaded) return;
        const nextRows = visibleItems();
        if (!nextRows.length) {
          render();
          return;
        }
        state.visibleLimit = Math.min(nextRows.length, state.visibleLimit + baseVisibleLimit());
        render();
        if (state.visibleLimit < nextRows.length) {
          requestAnimationFrame(() => {
            if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 900) maybeLoadMore();
          });
        }
      }

      function viewCacheKey(kind, sourceId = state.selectedSource, skipFilter = '') {
        return [
          kind,
          state.itemsRevision,
          state.tab,
          sourceId,
          skipFilter,
          state.query,
          state.filters.year,
          state.filters.area,
          state.filters.genre,
          state.filters.sort,
        ].join('\u001f');
      }

      function itemMatches(item, sourceId, enforceSource, skipFilter = '') {
        const source = sourceById(item.sourceId);
        if (state.healthIndex.posters.has(item.id)) return false;
        const adult = itemIsAdult(item, source);
        if ((sourceId === 'all' || sourceId === 'normal') && adult) return false;
        if (sourceId === 'adult18' && !adult) return false;
        if (enforceSource && !['all', 'normal', 'adult18'].includes(sourceId) && item.sourceId !== sourceId) return false;
        if (state.tab !== 'home' && state.tab !== 'rank' && item.kind !== state.tab) return false;
        if (skipFilter !== 'year' && state.filters.year !== 'all' && item._filterYear !== state.filters.year) return false;
        if (skipFilter !== 'area' && state.filters.area !== 'all' && !item._filterAreas?.includes(state.filters.area)) return false;
        if (skipFilter !== 'genre' && state.filters.genre !== 'all' && !item._filterGenres?.includes(state.filters.genre)) return false;
        const needle = currentSearchNeedle();
        if (!needle.query) return true;
        const searchText =
          item._searchText ||
          normalizedText(
            `${item.title} ${item.originalName} ${item.vodId} ${item.categoryName} ${item.year} ${item.area} ${itemGenres(item).join(' ')} ${item.sourceName}`,
          );
        return searchTextMatchesNeedle(searchText, item._searchCompact || compactNormalizedText(searchText), needle);
      }

      function sourceItems(sourceId = state.selectedSource, skipFilter = '') {
        const cacheKey = viewCacheKey('source', sourceId, skipFilter);
        if (state.viewCache.has(cacheKey)) return state.viewCache.get(cacheKey);
        const rows = state.catalog.items.filter((item) => itemMatches(item, sourceId, true, skipFilter));
        if (['all', 'normal', 'adult18'].includes(sourceId)) {
          state.viewCache.set(cacheKey, rows);
          return rows;
        }
        if (!rows.length && state.tab === 'short' && state.filters.area !== 'all') {
          const fallbackRows = state.catalog.items.filter((item) => itemMatches(item, 'normal', true, skipFilter));
          state.viewCache.set(cacheKey, fallbackRows);
          return fallbackRows;
        }
        state.viewCache.set(cacheKey, rows);
        return rows;
      }

      function fnv1aQueryShard(value) {
        let hash = 0x811c9dc5;
        const text = String(value || '');
        for (let index = 0; index < text.length; index += 1) {
          hash ^= text.charCodeAt(index);
          hash = Math.imul(hash, 0x01000193);
        }
        return hash >>> 0;
      }

      function queryShardPrefixes(needle, minimum) {
        const prefixes = new Set();
        for (const candidate of needle.candidates?.length ? needle.candidates : [needle]) {
          for (const value of [candidate.query, toSimplifiedSearchText(candidate.query)]) {
            const compact = compactNormalizedText(value);
            const characters = [...compact];
            if (characters.length >= minimum) prefixes.add(characters.slice(0, minimum).join(''));
          }
        }
        return [...prefixes];
      }

      function queryShardScopes() {
        if (state.selectedSource === 'all') return ['normal', 'adult'];
        if (state.selectedSource === 'adult18') return ['adult'];
        if (state.selectedSource === 'normal') return ['normal'];
        return [sourceById(state.selectedSource)?.adult ? 'adult' : 'normal'];
      }

      function queryShardFile(scope, bucket, manifest) {
        const width = Math.max(4, String(Math.max(0, Number(manifest.bucketCount || 1) - 1)).length);
        const bucketName = String(bucket).padStart(width, '0');
        const path = manifest.scopes?.[scope]?.path?.replace('{bucket}', bucketName);
        return path ? `../data/${path}` : '';
      }

      function expandQueryShard(payload) {
        const rows = [];
        for (const group of payload?.groups || []) {
          for (const signal of group?.signals || []) {
            rows.push({
              title: group.title || '',
              originalName: group.originalName || '',
              kind: group.kind || '',
              categoryName: group.categoryName || '',
              year: group.year || '',
              area: group.area || '',
              genre: Array.isArray(group.genre) ? group.genre : [],
              poster: group.poster || '',
              score: Number(signal.score || group.score || 0),
              hot: Number(signal.hot || group.hot || 0),
              updatedAt: signal.updatedAt || group.updatedAt || '',
              ...signal,
            });
          }
        }
        return rows;
      }

      function queryShardHealth(key) {
        if (!state.queryIndex.health.has(key)) {
          state.queryIndex.health.set(key, {
            score: 100,
            successes: 0,
            failures: 0,
            consecutiveFailures: 0,
            averageLatencyMs: 0,
            cooldownUntil: 0,
          });
        }
        return state.queryIndex.health.get(key);
      }

      function recordQueryShardHealth(key, ok, latencyMs) {
        const health = queryShardHealth(key);
        if (ok) {
          health.successes += 1;
          health.consecutiveFailures = 0;
          health.cooldownUntil = 0;
          health.score = Math.min(100, health.score + 4);
          health.averageLatencyMs = health.averageLatencyMs
            ? Math.round(health.averageLatencyMs * 0.7 + latencyMs * 0.3)
            : Math.round(latencyMs);
          return;
        }
        health.failures += 1;
        health.consecutiveFailures += 1;
        health.score = Math.max(0, health.score - 25);
        if (health.consecutiveFailures >= 2) health.cooldownUntil = Date.now() + QUERY_SHARD_COOLDOWN_MS;
      }

      function queryShardHealthSummary() {
        const rows = [...state.queryIndex.health.values()];
        if (!rows.length) return { score: 100, cooling: 0 };
        return {
          score: Math.round(rows.reduce((sum, item) => sum + item.score, 0) / rows.length),
          cooling: rows.filter((item) => item.cooldownUntil > Date.now()).length,
        };
      }

      async function loadQueryShard(scope, bucket, signal) {
        const manifest = state.queryIndex.manifest;
        const key = `${scope}\u001f${bucket}`;
        if (state.queryIndex.cache.has(key)) {
          const cached = state.queryIndex.cache.get(key);
          setBoundedCache(state.queryIndex.cache, key, cached, QUERY_SHARD_CACHE_LIMIT);
          return cached;
        }
        const file = queryShardFile(scope, bucket, manifest);
        if (!file) return { groups: [] };
        const health = queryShardHealth(key);
        if (health.cooldownUntil > Date.now()) {
          const error = new Error('Query shard is cooling down after repeated failures');
          error.name = 'CircuitOpenError';
          throw error;
        }
        const startedAt = performance.now();
        try {
          const payload = await getJson(file, null, {
            signal,
            timeoutMs: QUERY_SHARD_TIMEOUT_MS,
            throwOnFailure: true,
          });
          recordQueryShardHealth(key, true, performance.now() - startedAt);
          return setBoundedCache(state.queryIndex.cache, key, payload || { groups: [] }, QUERY_SHARD_CACHE_LIMIT);
        } catch (error) {
          if (error?.name !== 'AbortError') recordQueryShardHealth(key, false, performance.now() - startedAt);
          throw error;
        }
      }

      function searchProgressLabel() {
        const progress = state.searchProgress;
        if (!state.query || progress.query !== currentSearchNeedle().query) return '';
        const successful = Math.max(0, progress.completed - progress.failed);
        if (progress.status === 'loading') {
          return `搜尋 ${progress.completed}/${progress.total}，成功 ${successful}，失敗 ${progress.failed}`;
        }
        if (progress.status === 'timed-out') return `搜尋已逾時，保留已完成結果（${successful}/${progress.total}）`;
        if (progress.status === 'cancelled') return `搜尋已取消，保留已完成結果（${successful}/${progress.total}）`;
        if (progress.status === 'complete' && progress.failed) return `搜尋完成 ${successful}/${progress.total}，${progress.failed} 個分片暫時失敗`;
        if (progress.status === 'complete') return `搜尋完成 ${successful}/${progress.total}`;
        return '';
      }

      function searchProgressMarkup() {
        const label = searchProgressLabel();
        if (!label) return `<span class="status-pill ok">${icon('check')} ${displayHtml(catalogFreshnessLabel() ? `資料 ${catalogFreshnessLabel()}` : 'OKTV')}</span>`;
        if (state.searchLoading) {
          return `<button class="status-pill warn" type="button" data-cancel-search aria-label="取消搜尋">${icon('x')} ${displayHtml(label)}</button>`;
        }
        const health = queryShardHealthSummary();
        const statusClass = state.searchProgress.failed || state.searchProgress.status !== 'complete' ? 'warn' : 'ok';
        return `<span class="status-pill ${statusClass}">${icon(statusClass === 'ok' ? 'check' : 'signal')} ${displayHtml(`${label}｜健康 ${health.score}`)}</span>`;
      }

      function cancelActiveSearch(status = 'cancelled') {
        const active = state.searchLoadInFlight;
        if (state.searchDeadlineTimer !== null) window.clearTimeout(state.searchDeadlineTimer);
        state.searchDeadlineTimer = null;
        if (!active) return false;
        if (active.renderTimer) window.clearTimeout(active.renderTimer);
        state.searchProgress.status = status;
        state.searchLoading = false;
        state.searchLoadInFlight = null;
        if (state.searchAbortController === active.controller) state.searchAbortController = null;
        active.controller.abort(new DOMException('Search cancelled', 'AbortError'));
        return true;
      }

      function queueProgressiveSearchRender(loadToken, immediate = false) {
        if (state.searchLoadInFlight !== loadToken || loadToken.controller.signal.aborted) return;
        const renderNow = () => {
          loadToken.renderTimer = null;
          if (state.searchLoadInFlight !== loadToken || loadToken.controller.signal.aborted) return;
          loadToken.lastRenderAt = performance.now();
          state.refocusSearch = document.activeElement?.id === 'searchBox';
          clearViewCache();
          resetVisibleLimit();
          render();
        };
        const delay = immediate ? 0 : Math.max(0, SEARCH_PROGRESS_RENDER_MS - (performance.now() - loadToken.lastRenderAt));
        if (!delay) {
          if (loadToken.renderTimer) window.clearTimeout(loadToken.renderTimer);
          renderNow();
        } else if (!loadToken.renderTimer) {
          loadToken.renderTimer = window.setTimeout(renderNow, delay);
        }
      }

      function triggerSearchIndexLoad() {
        const needle = currentSearchNeedle();
        const manifest = state.queryIndex.manifest;
        const minimum = Math.max(2, Number(manifest?.minQueryLength || 2));
        if (state.tab === 'live' || [...needle.query].length < minimum || !manifest) {
          cancelActiveSearch('cancelled');
          state.searchAbortController = null;
          state.searchLoading = false;
          return;
        }
        const scopeKey = [state.tab, state.selectedSource, needle.query].join('\u001f');
        if (state.searchLoadInFlight?.scopeKey === scopeKey) return;
        if (
          state.searchProgress.scopeKey === scopeKey &&
          ['complete', 'timed-out', 'cancelled'].includes(state.searchProgress.status)
        ) {
          return;
        }
        cancelActiveSearch('cancelled');
        const controller = new AbortController();
        state.searchAbortController = controller;
        const prefixes = queryShardPrefixes(needle, minimum);
        const targets = [];
        const targetKeys = new Set();
        for (const scope of queryShardScopes()) {
          const scopeManifest = manifest.scopes?.[scope];
          if (!scopeManifest) continue;
          const available = new Set(scopeManifest.buckets || []);
          for (const prefix of prefixes) {
            const bucket = fnv1aQueryShard(prefix) % Number(manifest.bucketCount || 1);
            const key = `${scope}\u001f${bucket}`;
            if (!available.has(bucket) || targetKeys.has(key)) continue;
            targetKeys.add(key);
            targets.push({ scope, bucket });
          }
        }
        if (!targets.length) {
          state.searchLoading = false;
          state.searchLoadInFlight = null;
          state.searchProgress = {
            query: needle.query,
            scopeKey,
            completed: 0,
            total: 0,
            failed: 0,
            status: 'complete',
          };
          return;
        }
        state.searchLoading = true;
        const startedAt =
          state.searchProgress.query === needle.query && Number(state.searchProgress.startedAt) > 0
            ? state.searchProgress.startedAt
            : Date.now();
        state.searchProgress = {
          query: needle.query,
          scopeKey,
          completed: 0,
          total: targets.length,
          failed: 0,
          status: 'loading',
          startedAt,
        };
        const loadToken = {
          scopeKey,
          controller,
          promise: null,
          renderTimer: null,
          lastRenderAt: 0,
          timedOut: false,
        };
        state.searchLoadInFlight = loadToken;
        if (state.searchDeadlineTimer !== null) window.clearTimeout(state.searchDeadlineTimer);
        const deadlineDelay = Math.max(0, startedAt + QUERY_SEARCH_TIMEOUT_MS - Date.now());
        state.searchDeadlineTimer = window.setTimeout(() => {
          if (state.searchProgress.query !== needle.query || state.searchProgress.status !== 'loading') return;
          const active = state.searchLoadInFlight;
          if (active) active.timedOut = true;
          state.searchProgress.status = 'timed-out';
          state.searchLoading = false;
          state.searchLoadInFlight = null;
          state.searchDeadlineTimer = null;
          if (state.searchAbortController === active?.controller) state.searchAbortController = null;
          active?.controller.abort(new DOMException('Search timed out', 'TimeoutError'));
          clearViewCache();
          resetVisibleLimit();
          render();
        }, deadlineDelay);
        const promise = (async () => {
          let nextIndex = 0;
          const worker = async () => {
            while (nextIndex < targets.length) {
              const targetIndex = nextIndex;
              nextIndex += 1;
              const target = targets[targetIndex];
              if (controller.signal.aborted || state.searchLoadInFlight !== loadToken) return;
              try {
                const payload = await loadQueryShard(target.scope, target.bucket, controller.signal);
                if (controller.signal.aborted || state.searchLoadInFlight !== loadToken) return;
                const selectedRows = await matchingSearchIndexRows(expandQueryShard(payload), needle, controller.signal);
                if (controller.signal.aborted || state.searchLoadInFlight !== loadToken) return;
                registerCatalogItems(selectedRows, { searchResult: true });
              } catch (error) {
                if (controller.signal.aborted || error?.name === 'AbortError') return;
                state.searchProgress.failed += 1;
                console.warn('query-shard-load-failed', target.scope, target.bucket, error?.name || 'Error');
              } finally {
                if (!controller.signal.aborted && state.searchLoadInFlight === loadToken) {
                  state.searchProgress.completed += 1;
                  queueProgressiveSearchRender(loadToken);
                }
              }
            }
          };
          await Promise.all(
            Array.from({ length: Math.min(QUERY_SEARCH_CONCURRENCY, targets.length) }, () => worker()),
          );
        })()
          .catch((error) => {
            if (error?.name !== 'AbortError') console.warn('query-shard-search-failed', error);
          })
          .finally(() => {
            if (loadToken.renderTimer) window.clearTimeout(loadToken.renderTimer);
            if (state.searchLoadInFlight !== loadToken) return;
            if (state.searchDeadlineTimer !== null) window.clearTimeout(state.searchDeadlineTimer);
            state.searchDeadlineTimer = null;
            state.searchLoading = false;
            state.searchLoadInFlight = null;
            if (state.searchAbortController === controller) state.searchAbortController = null;
            if (loadToken.timedOut) state.searchProgress.status = 'timed-out';
            else if (state.searchProgress.status === 'loading') state.searchProgress.status = 'complete';
            clearViewCache();
            resetVisibleLimit();
            render();
          });
        loadToken.promise = promise;
      }

      function numericValue(value) {
        const number = Number(String(value ?? '').replace(/[^\d.-]/g, ''));
        return Number.isFinite(number) ? number : 0;
      }

      function itemTimeValue(item) {
        const raw = String(item?.updatedAt || item?.updateTime || item?.vod_time || '').trim();
        if (!raw) return 0;
        const time = Date.parse(raw.replace(' ', 'T'));
        return Number.isFinite(time) ? time : 0;
      }

      function compactDateTime(value) {
        const raw = String(value || '').trim();
        if (!raw) return '';
        const time = Date.parse(raw.includes('T') ? raw : raw.replace(' ', 'T'));
        if (!Number.isFinite(time)) return '';
        const date = new Date(time);
        const pad = (number) => String(number).padStart(2, '0');
        return `${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function formatCount(value) {
        const count = Number(value || 0);
        return Number.isFinite(count) ? new Intl.NumberFormat('zh-TW').format(count) : '0';
      }

      function catalogFreshnessLabel() {
        return compactDateTime(state.catalog?.generatedAt) || compactDateTime(state.catalog?.source?.generatedAt);
      }

      function itemRecencyScore(item) {
        const time = itemTimeValue(item);
        if (!time) return 0;
        const ageDays = Math.max(0, (Date.now() - time) / 86400000);
        return 720 / (1 + ageDays / 21);
      }

      function itemScoreValue(item) {
        const score = numericValue(item?.score);
        if (!score) return 0;
        return score > 10 ? Math.min(10, score / 10) : Math.min(10, score);
      }

      function itemCompletionScore(item) {
        const text = normalizedText(`${item?.remarks || ''} ${item?.categoryName || ''}`);
        let score = 0;
        if (/\u6b63\u7247|HD|BD|\u5b8c\u7ed3|\u5b8c\u7d50|\u5168\d+|\u5168\u96c6/i.test(text)) score += 120;
        if (/\u66f4\u65b0\u81f3|\u7b2c\d+\u96c6|\u7b2c\d+\u671f/i.test(text)) score += 70;
        const episodes = numericValue(item?.episodeCount);
        if (item?.kind === 'movie' && episodes > 3) score -= 520;
        if (['series', 'short', 'anime', 'variety'].includes(item?.kind)) score += Math.min(episodes, 80) * 3;
        return score;
      }

      function itemSignalScore(item) {
        return Math.min(numericValue(item?.signalCount || 1), 8) * 18;
      }

      function sourceHealthScore(source) {
        if (!source) return 50;
        if (source.error || state.healthIndex.sources.has(source.id)) return 0;
        const checks = Array.isArray(source.checks) ? source.checks.filter((check) => typeof check?.ok === 'boolean') : [];
        const passedRatio = checks.length ? checks.filter((check) => check.ok).length / checks.length : 0.7;
        const coverage = Math.max(0, Math.min(1, Number(source.coverageGuard?.retention ?? 1)));
        const completeness = source.complete ? 10 : source.indexed ? 5 : 0;
        return Math.round(Math.max(0, Math.min(100, passedRatio * 70 + coverage * 20 + completeness)));
      }

      function itemSourceHealthScore(item) {
        return sourceHealthScore(sourceById(item?.sourceId));
      }

      function itemRankScore(item, mode = 'hot') {
        const views = numericValue(item?.views);
        const hot = numericValue(item?.hot);
        const score = itemScoreValue(item);
        const recency = itemRecencyScore(item);
        const completion = itemCompletionScore(item);
        const signal = itemSignalScore(item);
        const sourceHealth = itemSourceHealthScore(item) * 2;
        const viewScore = views > 0 ? Math.log10(views + 1) * 2600 : 0;
        const base = Math.max(hot, viewScore) + score * 135 + recency + completion + signal + sourceHealth;
        if (mode === 'views') {
          return views > 0 ? viewScore + hot * 0.18 + score * 80 + recency * 0.55 + completion + signal : base;
        }
        if (mode === 'score') return score * 1200 + base * 0.08;
        if (mode === 'latest') return itemTimeValue(item) / 1000000 + base * 0.02;
        return base;
      }

      function compareRankedItems(a, b, mode = state.filters.sort) {
        if (mode === 'name') return a.title.localeCompare(b.title, 'zh-Hant');
        const rankDiff = itemRankScore(b, mode) - itemRankScore(a, mode);
        if (Math.abs(rankDiff) > 0.0001) return rankDiff;
        const timeDiff = itemTimeValue(b) - itemTimeValue(a);
        if (timeDiff) return timeDiff;
        const scoreDiff = itemScoreValue(b) - itemScoreValue(a);
        if (scoreDiff) return scoreDiff;
        return String(a.title || '').localeCompare(String(b.title || ''), 'zh-Hant');
      }

      function sortedItems(items) {
        return [...items].sort((a, b) => compareRankedItems(a, b));
      }

      function renderNav() {
        topNav.innerHTML = `<button class="nav-source-btn" type="button" data-open-source-nav aria-label="點播訊號源">${generatedSourceIcon()}</button>${tabs
          .map(([id, label]) => `<button class="nav-btn ${state.tab === id ? 'is-active' : ''}" type="button" data-tab="${id}">${displayHtml(label)}</button>`)
          .join('')}`;
        topNav.querySelectorAll('[data-tab]').forEach((button) => {
          button.addEventListener('click', () => {
            state.tab = button.dataset.tab || 'home';
            state.query = '';
            cancelActiveSearch('cancelled');
            state.searchProgress = { query: '', completed: 0, total: 0, failed: 0, status: 'idle' };
            clearTransientSearchItems();
            clearViewCache();
            resetVisibleLimit();
            resetPageViewport();
            render();
          });
        });
        topNav.querySelector('[data-open-source-nav]')?.addEventListener('click', openSourceSheet);
      }

      function render() {
        renderNav();
        if (state.tab === 'live') {
          state.renderLayoutKey = '';
          return renderLive();
        }
        if (state.tab === 'rank') {
          state.renderLayoutKey = '';
          return renderRank();
        }
        return renderVodScreen();
      }

      function renderToolbar(placeholder = '搜尋片名、類型、年份') {
        return `
          <div class="toolbar">
            <input class="search" id="searchBox" type="search" value="${escapeHtml(state.query)}" placeholder="${displayHtml(placeholder)}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
            <button class="icon-btn" type="button" data-open-filter aria-label="篩選器">${icon('filter')}</button>
          </div>
        `;
      }

      function focusSearchBox() {
        if (!state.refocusSearch) return;
        state.refocusSearch = false;
        requestAnimationFrame(() => {
          const input = document.querySelector('#searchBox');
          if (!input) return;
          input.focus({ preventScroll: true });
          try {
            input.setSelectionRange(state.query.length, state.query.length);
          } catch {
            undefined;
          }
        });
      }

      function scheduleSearchRender(value, delay = 260) {
        if (state.query === value && !state.refocusSearch) return;
        cancelActiveSearch('cancelled');
        clearTransientSearchItems();
        state.query = value;
        state.searchProgress = { query: '', completed: 0, total: 0, failed: 0, status: 'idle' };
        clearViewCache();
        resetVisibleLimit();
        window.clearTimeout(searchRenderTimer);
        searchRenderTimer = window.setTimeout(() => {
          if (!state.searchComposing) render();
        }, delay);
      }

      function bindToolbar() {
        const input = document.querySelector('#searchBox');
        input?.addEventListener('compositionstart', () => {
          state.searchComposing = true;
          window.clearTimeout(searchRenderTimer);
        });
        input?.addEventListener('compositionend', (event) => {
          state.searchComposing = false;
          scheduleSearchRender(event.target.value, 0);
        });
        input?.addEventListener('input', (event) => {
          if (state.searchComposing || event.isComposing) return;
          scheduleSearchRender(event.target.value);
        });
        input?.addEventListener('search', (event) => scheduleSearchRender(event.target.value, 0));
        input?.addEventListener('change', (event) => scheduleSearchRender(event.target.value, 0));
        input?.addEventListener('keyup', (event) => {
          if (state.searchComposing || event.isComposing) return;
          if (event.target.value !== state.query) scheduleSearchRender(event.target.value, 0);
        });
        document.querySelector('[data-open-filter]')?.addEventListener('click', openFilterSheet);
        focusSearchBox();
      }

      function bindSearchProgress() {
        document.querySelector('[data-cancel-search]')?.addEventListener('click', () => {

          clearViewCache();
          resetVisibleLimit();
          render();
        });
      }

      function filterValues(key) {
        const cacheKey = viewCacheKey(`filter:${key}`, state.selectedSource, key);
        if (state.viewCache.has(cacheKey)) return state.viewCache.get(cacheKey);
        const values = sourceItems(state.selectedSource, key)
          .map((item) => {
            if (key === 'year') return [item._filterYear];
            if (key === 'area') return item._filterAreas || [];
            if (key === 'genre') return item._filterGenres || [];
            return [item[key]];
          })
          .flat()
          .filter(Boolean);
        const unique = [...new Set(values)];
        const result = unique.sort((a, b) => (key === 'year' ? b.localeCompare(a) : a.localeCompare(b, 'zh-Hant')));
        state.viewCache.set(cacheKey, result);
        return result;
      }
