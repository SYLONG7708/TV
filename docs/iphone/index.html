      async function resolvePlayableSignal(item, { allowAlternates = true } = {}) {
        const signals = signalSourcesFor(item);
        const candidates = [item];
        if (allowAlternates) {
          for (const signal of signals) {
            const candidate = state.itemById.get(signal.itemId);
            if (candidate && !candidates.some((entry) => entry.id === candidate.id)) candidates.push(candidate);
          }
        }
        candidates.sort((left, right) => {
          const leftEmbedded = Array.isArray(left.episodes) ? left.episodes.length : 0;
          const rightEmbedded = Array.isArray(right.episodes) ? right.episodes.length : 0;
          return rightEmbedded - leftEmbedded || Number(Boolean(right.detailPath)) - Number(Boolean(left.detailPath));
        });
        const failures = [];
        for (const candidate of candidates.slice(0, AUTO_SIGNAL_FALLBACK_LIMIT)) {
          try {
            const hydrated = await hydrateItemDetail(candidate);
            if (!Array.isArray(hydrated.episodes) || !hydrated.episodes.length) {
              failures.push(signalSourceLabel(candidate) || candidate.sourceName || candidate.id);
              continue;
            }
            hydrated.signalSources = signals;
            hydrated.signalCount = signals.length;
            delete hydrated.playbackError;
            return hydrated;
          } catch {
            failures.push(signalSourceLabel(candidate) || candidate.sourceName || candidate.id);
          }
        }
        item.signalSources = signals;
        item.signalCount = signals.length;
        item.playbackError = failures.length
          ? `已檢查 ${failures.length} 個訊號源，目前均沒有有效集數。請稍後再試或切換其他來源。`
          : '目前沒有有效播放訊號。請稍後再試。';
        return item;
      }

      async function openDetail(id) {
        const item = state.itemById.get(id);
        if (!item) return;
        state.activeItem = item;
        detailTitle.textContent = displayText(item.title);
        detailMeta.textContent = displayText([signalSourceLabel(item), item.year, item.area, item.categoryName].filter(Boolean).join(' / '));
        renderDetailLoading(item);
        openSheet(detailSheet);
        const resolved = await resolvePlayableSignal(item);
        if (state.activeItem?.id === item.id) {
          state.activeItem = resolved;
          detailTitle.textContent = displayText(resolved.title);
          detailMeta.textContent = displayText(
            [signalSourceLabel(resolved), resolved.year, resolved.area, resolved.categoryName].filter(Boolean).join(' / '),
          );
          renderDetailBody(resolved, 0);
        }
      }

      function episodePageCount(item) {
        return Math.max(1, Math.ceil((item.episodes?.length || 0) / EPISODES_PER_PAGE));
      }

      function renderEpisodePager(item, page) {
        const total = item.episodes?.length || 0;
        const pages = episodePageCount(item);
        if (pages <= 1) return '';
        return `
          <div class="episode-toolbar">
            <small>${displayHtml(`共 ${total} 集，每頁 20 集`)}</small>
            <div class="episode-pages" aria-label="集數分頁">
              ${Array.from({ length: pages }, (_, index) => {
                const start = index * EPISODES_PER_PAGE + 1;
                const end = Math.min(total, (index + 1) * EPISODES_PER_PAGE);
                return `<button class="${index === page ? 'is-active' : ''}" type="button" data-episode-page="${index}">${displayHtml(`${start}-${end} 集`)}</button>`;
              }).join('')}

          <div class="signal-strip">
            ${signals
              .map(
                (signal) =>
                  `<button class="signal-chip ${signal.itemId === item.id ? 'is-active' : ''}" type="button" data-signal-item="${escapeHtml(signal.itemId)}">${signal.adult ? adultIcon('adult-content-icon') : icon('signal')}${displayHtml(signal.sourceName || 'OKTV')}</button>`,
              )
              .join('')}

        `;

      function bindDetailEpisodeControls(item) {
        detailBody.querySelectorAll('[data-signal-item]').forEach((button) => {
          button.addEventListener('click', async () => {
            const next = state.itemById.get(button.dataset.signalItem);
            if (!next) return;
            next.signalSources = signalSourcesFor(item);
            next.signalCount = next.signalSources.length;
            state.activeItem = next;
            detailTitle.textContent = displayText(next.title);
            detailMeta.textContent = displayText([signalSourceLabel(next), next.year, next.area, next.categoryName].filter(Boolean).join(' / '));
            renderDetailLoading(next);
            const resolved = await resolvePlayableSignal(next, { allowAlternates: false });
            if (state.activeItem?.id === next.id) {
              state.activeItem = resolved;
              renderDetailBody(resolved, 0);
            }
          });
        });
        detailBody.querySelectorAll('[data-episode-page]').forEach((button) => {
          button.addEventListener('click', () => renderDetailBody(item, Number(button.dataset.episodePage || 0)));
        });
        detailBody.querySelectorAll('[data-episode]').forEach((button) => {

            if (episode) openPlayer(item.title, episode.name, episode.url);

      function renderDetailLoading(item) {
        detailBody.innerHTML = `
          <div class="detail-grid">
            ${renderPosterArt(item)}
            <div class="detail-copy">
              <h2>${displayHtml(item.title)}</h2>
              <div class="item-meta">${displayHtml([item.remarks, item.episodeCount ? `${item.episodeCount} 集` : '', item.updatedAt].filter(Boolean).join(' / '))}</div>

      function renderDetailBody(item, page = 0) {
        const total = item.episodes?.length || 0;
        const pages = episodePageCount(item);
        const safePage = Math.min(Math.max(Number(page) || 0, 0), pages - 1);
        const start = safePage * EPISODES_PER_PAGE;
        const rows = (item.episodes || []).slice(start, start + EPISODES_PER_PAGE);
        detailBody.innerHTML = `
          <div class="detail-grid">
            ${renderPosterArt(item)}
            <div class="detail-copy">
              <h2>${displayHtml(item.title)}</h2>
              <div class="item-meta">${displayHtml([item.remarks, item.score ? `評分 ${item.score}` : '', item.updatedAt].filter(Boolean).join(' / '))}</div>
              <p>${displayHtml(plainTextFromMarkup(item.content || item.actor || item.director) || '此內容已建立 OKTV 手機索引。')}</p>
            </div>
          </div>
          ${renderSignalSourceControls(item)}
          <section class="section-head"><h2>播放</h2><span>${total} 集</span></section>
          ${renderEpisodePager(item, safePage)}
          <div class="episode-grid">
            ${
              rows.length
                ? rows
                    .map((episode, index) => `<button type="button" data-episode="${start + index}">${displayHtml(episode.name || `第 ${start + index + 1} 集`)}</button>`)
                    .join('')
                : `<span>${displayHtml(item.playbackError || '目前沒有有效播放訊號；可嘗試上方其他訊號源。')}</span>`
            }
          </div>
        `;
        bindDetailEpisodeControls(item);
      }

      function openPlayer(title, meta, url, embedUrl = '') {
        const verifiedEmbedUrl = embedUrl ? safeEmbedUrl(embedUrl) : '';
        const verifiedMediaUrl = embedUrl ? '' : safeHttpUrl(url);
        closeDetail(false);
        hls?.destroy?.();
        hls = null;
        player.pause();
        player.removeAttribute('src');
        player.load();
        playerFrame.removeAttribute('src');
        playerFrame.classList.add('hidden');
        player.classList.remove('hidden');
        playerTitle.textContent = displayText(title);
        playerMeta.textContent =
          (embedUrl && !verifiedEmbedUrl) || (!embedUrl && !verifiedMediaUrl)
            ? '已阻擋不安全或不支援的播放網址'
            : displayText(meta);
        state.playerUrl = verifiedEmbedUrl || verifiedMediaUrl;
        openSheet(playerSheet);

        if (!state.playerUrl) return;

        if (verifiedEmbedUrl) {
          player.classList.add('hidden');
          playerFrame.classList.remove('hidden');
          playerFrame.src = verifiedEmbedUrl;
          return;
        }

        if (/\.m3u8(?:$|\?)/i.test(verifiedMediaUrl) && window.Hls?.isSupported?.()) {
          hls = new window.Hls({
            lowLatencyMode: false,
            enableWorker: true,
            backBufferLength: 30,
            maxBufferLength: 30,
            manifestLoadingTimeOut: 15000,
            fragLoadingTimeOut: 20000,
          });
          hls.loadSource(verifiedMediaUrl);
          hls.attachMedia(player);
          hls.on(window.Hls.Events.ERROR, (_event, data) => {
            if (!data?.fatal) return;
            playerMeta.textContent = '此訊號目前無法播放，請返回並切換其他訊號源。';
            hls?.destroy?.();
            hls = null;
          });
        } else {
          player.src = verifiedMediaUrl;
        }
        player.onerror = () => {
          playerMeta.textContent = '此訊號目前無法播放，請返回並切換其他訊號源。';
        };
        player.play().catch(() => undefined);
      }

      function closePlayer() {
        hls?.destroy?.();
        hls = null;
        playerFrame.removeAttribute('src');
        playerFrame.classList.add('hidden');
        player.classList.remove('hidden');
        player.pause();
        player.onerror = null;
        player.removeAttribute('src');
        player.load();
        state.playerUrl = '';
        closeSheet(playerSheet);
      }

      function openSourceSheet() {
        const current = activeSource();
        state.sourceSheetMode = state.selectedSource === 'adult18' || current?.adult ? 'adult' : 'normal';
        renderSourceSheetBody();
        openSheet(sourceSheet);
      }

      function renderSourceSheetBody() {
        const normalSources = state.catalog.sources.filter((source) => !source.adult);
        const adultSources = state.catalog.sources.filter((source) => source.adult);
        const mode = state.sourceSheetMode === 'adult' ? 'adult' : 'normal';
        const rows = mode === 'adult' ? adultSources : normalSources;
        const allSourceId = mode === 'adult' ? 'adult18' : 'normal';
        const allLabel = mode === 'adult' ? '成人 18+ 全部' : '全部一般來源';
        const allIcon = mode === 'adult' ? adultIcon() : generatedSourceIcon();
        const itemCount = rows.reduce((sum, source) => sum + Number(source.itemCount || 0), 0);
        sourceSheetMeta.textContent = mode === 'adult' ? '成人 18+ 已獨立分類，不混入一般來源' : '一般來源，不含成人 18+';
        sourceSheetBody.innerHTML = `
          <div class="source-mode-row">
            <button class="chip ${mode === 'normal' ? 'is-active' : ''}" type="button" data-source-mode="normal">一般點播源</button>
            <button class="chip ${mode === 'adult' ? 'is-active' : ''}" type="button" data-source-mode="adult">${adultIcon()} 成人 18+</button>
          </div>
          <section class="source-list">
            <div class="source-section-label ${mode === 'adult' ? 'is-adult' : ''}"><span>${mode === 'adult' ? adultIcon() : ''}${mode === 'adult' ? '成人 18+' : '一般點播源'}</span><small>${rows.length} 個來源</small></div>
            <article class="source-row">
              <div class="avatar">${allIcon}</div>
              <div class="row-main"><strong>${allIcon} ${allLabel}</strong><span>${formatCount(itemCount)} 部完整索引內容</span></div>
              <button class="play-btn" type="button" data-sheet-source="${allSourceId}">${icon(state.selectedSource === allSourceId ? 'check' : 'signal')}${state.selectedSource === allSourceId ? '使用中' : '切換'}</button>
            </article>
            ${rows.map((source) => renderSheetSourceRow(source)).join('') || emptyState('目前沒有此分類來源')}
          </section>
        `;
        sourceSheetBody.querySelectorAll('[data-source-mode]').forEach((button) => {
          button.addEventListener('click', () => {
            state.sourceSheetMode = button.dataset.sourceMode || 'normal';
            renderSourceSheetBody();
          });
        });
        sourceSheetBody.querySelectorAll('[data-sheet-source]').forEach((button) => {
          button.addEventListener('click', async () => {
            await selectSource(button.dataset.sheetSource || 'all');
            closeSheet(sourceSheet);
          });
        });
      }

      function renderSheetSourceRow(source) {
        const active = state.selectedSource === source.id;
        const canSelect = source.indexed;
        const healthScore = sourceHealthScore(source);
        return `
          <article class="source-row">
            <div class="avatar">${source.adult ? adultIcon() : generatedSourceIcon()}</div>
            <div class="row-main">
              <strong>${sourceNameMarkup(source)}</strong>
              <span>${displayHtml(source.origin)} / ${formatCount(source.itemCount)} 部 / ${formatCount(source.playableCount)} 可播放 / 健康 ${healthScore}</span>
            </div>
            ${
              canSelect
                ? `<button class="play-btn" type="button" data-sheet-source="${escapeHtml(source.id)}">${icon(active ? 'check' : 'signal')}${active ? '使用中' : '切換'}</button>`
                : `<span class="status-pill warn">${source.adult ? '18+' : source.type === 3 ? 'Spider' : '未索引'}</span>`
            }
          </article>
        `;
      }

      function openFilterSheet() {
        const filter = (label, key, values) => `
          <section class="section-head"><h2>${label}</h2></section>
          <div class="chip-row">
            ${values
              .map(
                ([value, text]) =>
                  `<button class="chip ${state.filters[key] === value ? 'is-active' : ''}" type="button" data-filter-key="${key}" data-filter-value="${escapeHtml(value)}">${displayHtml(text)}</button>`,
              )
              .join('')}
          </div>
        `;
        const years = filterValues('year').slice(0, 36);
        const areas = filterValues('area').slice(0, 36);
        const genres = filterValues('genre').slice(0, 48);
        const sorts = [
          ['hot', '熱門'],
          ['views', '觀看人數'],
          ['latest', '發布時間'],
          ['score', '評分'],
          ['name', '名稱'],
        ];
        filterSheetBody.innerHTML = `
          ${years.length ? filter('年份', 'year', [['all', '全部年份'], ...years.map((year) => [year, year])]) : ''}
          ${areas.length ? filter('地區', 'area', [['all', '全部地區'], ...areas.map((area) => [area, area])]) : ''}
          ${genres.length ? filter('類型', 'genre', [['all', '全部類型'], ...genres.map((genre) => [genre, genre])]) : ''}
          ${filter('排序', 'sort', sorts)}
          <button class="play-btn reset-filter-btn" type="button" data-reset-filter>重設篩選</button>
        `;
        filterSheetBody.querySelectorAll('[data-filter-key]').forEach((button) => {
          button.addEventListener('click', () => {
            state.filters[button.dataset.filterKey] = button.dataset.filterValue || 'all';
            clearViewCache();
            resetVisibleLimit();
            resetPageViewport();
            openFilterSheet();
            render();
          });
        });
        filterSheetBody.querySelector('[data-reset-filter]')?.addEventListener('click', () => {
          state.filters = { year: 'all', area: 'all', genre: 'all', sort: 'hot' };
          clearViewCache();
          resetVisibleLimit();
          resetPageViewport();
          closeSheet(filterSheet);
          render();
        });
        openSheet(filterSheet);
      }

      async function selectSource(sourceId) {
        cancelActiveSearch('cancelled');
        state.searchProgress = { query: '', completed: 0, total: 0, failed: 0, status: 'idle' };
        clearTransientSearchItems();
        state.selectedSource = sourceId;
        localStorage.setItem(SOURCE_STORAGE_KEY, sourceId);
        state.tab = state.tab === 'sources' ? 'movie' : state.tab;
        clearViewCache();
        resetVisibleLimit();
        resetPageViewport();
        const combinedSource = ['all', 'normal', 'adult18'].includes(sourceId);
        state.sourceLoading = !combinedSource;
        render();
        if (combinedSource) return;
        try {
          await ensureSelectedSourceItems(sourceId);
        } finally {
          if (state.selectedSource === sourceId) {
            state.sourceLoading = false;
            render();
          }
        }
      }

      function sortLabel(value) {
        return { hot: '熱門', views: '觀看人數', latest: '發布時間', score: '評分', name: '名稱' }[value] || value;
      }

      function kindLabel(kind) {
        return { hls: 'M3U8', youtube: 'YouTube', stream: 'HTTP', external: '外部', network: '內網', unknown: '未知' }[kind] || kind;
      }

      function emptyState(text) {
        return `<p class="notice">${displayHtml(text)}</p>`;
      }

      function openSheet(sheet) {
        sheet.classList.add('is-open');
        sheet.setAttribute('aria-hidden', 'false');
      }

      function closeSheet(sheet) {
        sheet.classList.remove('is-open');
        sheet.setAttribute('aria-hidden', 'true');
      }

      function closeDetail(close = true) {
        if (close) closeSheet(detailSheet);
      }

      function applyHealthIndex(health) {
        state.health = health || { failed: [] };
        const currentLiveUrls = new Map(state.live.map((item) => [item.id, item.url]));
        state.healthIndex = {
          sources: new Set((state.health.failed || []).filter((row) => row.kind === 'source').map((row) => row.id)),
          posters: new Set((state.health.failed || []).filter((row) => row.kind === 'poster').map((row) => row.id)),
          live: new Set(
            (state.health.failed || [])
              .filter((row) => row.kind === 'live' && currentLiveUrls.get(row.id) === row.url)
              .map((row) => row.id),
          ),
        };
        clearViewCache();
      }

      document.querySelectorAll('[data-close-sheet]').forEach((item) => item.addEventListener('click', () => closeSheet(sourceSheet)));
      document.querySelectorAll('[data-close-filter]').forEach((item) => item.addEventListener('click', () => closeSheet(filterSheet)));
      document.querySelectorAll('[data-close-detail]').forEach((item) => item.addEventListener('click', () => closeDetail(true)));
      document.querySelectorAll('[data-close-player]').forEach((item) => item.addEventListener('click', closePlayer));
      document.querySelector('#sourceSheet [data-close-sheet].icon-btn').innerHTML = icon('close');
      document.querySelector('#filterSheet [data-close-filter].icon-btn').innerHTML = icon('close');
      document.querySelector('#detailSheet [data-close-detail].icon-btn').innerHTML = icon('close');
      document.querySelector('#playerSheet [data-close-player].icon-btn').innerHTML = icon('close');

      [state.catalog, state.latest, state.live, state.queryIndex.manifest] = await Promise.all([
        getJson('../data/iphone-vod-catalog.json', state.catalog),
        getJson('../data/iphone-vod-latest.json', { items: [] }),
        getJson('../data/live-channels.json', []),
        getJson(QUERY_MANIFEST_URL, null),
      ]);
      state.catalog.sources = Array.isArray(state.catalog.sources) ? state.catalog.sources : [];
      state.sourceMap = new Map(state.catalog.sources.map((source) => [source.id, source]));
      await loadQuantumManifest();
      const initialCatalogItems = Array.isArray(state.catalog.items) ? state.catalog.items : [];
      const latestCatalogItems = Array.isArray(state.latest.items) ? state.latest.items : [];
      const fallbackQueryItems = Array.isArray(state.queryIndex.manifest?.fallbackItems)
        ? state.queryIndex.manifest.fallbackItems
        : [];
      state.catalog.items = [];
      state.itemById.clear();
      registerCatalogItems(initialCatalogItems);
      registerCatalogItems(latestCatalogItems);
      registerCatalogItems(fallbackQueryItems);
      state.seedItemIds = new Set(state.itemById.keys());
      markLatestPagesLoaded(latestCatalogItems);
      applyHealthIndex({ failed: [] });
      localStorage.removeItem('oktv:iphone:selectedSource');
      const storedSource = localStorage.getItem(SOURCE_STORAGE_KEY);
      if (!storedSource || storedSource === 'all' || state.selectedSource === 'default') {
        state.selectedSource = 'normal';
        localStorage.setItem(SOURCE_STORAGE_KEY, state.selectedSource);
      }
      if (
        !['all', 'normal', 'adult18'].includes(state.selectedSource) &&
        !state.catalog.sources.some((source) => source.id === state.selectedSource && source.indexed)
      ) {
        state.selectedSource = 'normal';
        localStorage.setItem(SOURCE_STORAGE_KEY, state.selectedSource);
      }
      const selectedSourceAtBoot = state.selectedSource;
      const combinedSourceAtBoot = ['all', 'normal', 'adult18'].includes(selectedSourceAtBoot);
      state.sourceLoading = !combinedSourceAtBoot;
      if (!combinedSourceAtBoot) {
        await ensureSelectedSourceItems(selectedSourceAtBoot);
        state.sourceLoading = false;
      }
      window.addEventListener('scroll', maybeLoadMore, { passive: true });
      resetVisibleLimit();
      render();
      getJson('../data/iphone-health-check-latest.json', { failed: [] }).then((health) => {
        applyHealthIndex(health);
        render();
      });
    </script>
  </body>
</html>
